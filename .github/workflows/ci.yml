name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The model/eval tests are self-contained and need only the numeric
      # stack, so CI stays fast and does not pull tensorflow/torch/pyspark.
      - run: pip install numpy pandas scikit-learn pytest
      - run: pytest tests/test_returns_prediction.py tests/test_timeseries_cv.py tests/test_recommender_eval.py -q
